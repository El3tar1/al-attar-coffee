<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>بن العطار - قهوة تصنع للذوق</title>
<meta name="description" content="بن العطار - قهوة تصنع للذوق. قهوة تركي 30ج فرنساوي 45ج. أبو كبير - الشرقية" />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;800&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#0a0a0a;color:#f5f2eb;overflow-x:hidden}
.gold{color:#c9a96e}
#hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;background:linear-gradient(rgba(10,10,10,0.7),rgba(10,10,10,0.9)),url('https://images.unsplash.com/photo-1447933601403-0c6688de566e?q=80&w=2070') center/cover;background-attachment:fixed}
.hero-content h1{font-size:4rem;font-weight:800;margin-bottom:1rem;animation:fadeInUp 1s ease}
.hero-content p{font-size:1.5rem;margin-bottom:2rem;animation:fadeInUp 1s ease .2s both}
.btn{display:inline-block;padding:18px 45px;background:#c9a96e;color:#0a0a0a;text-decoration:none;font-weight:800;font-size:1.2rem;border-radius:50px;transition:.3s;animation:fadeInUp 1s ease .4s both}
.btn:hover{background:transparent;color:#c9a96e;transform:translateY(-3px)}
#info{min-height:100vh;padding:5rem 2rem;text-align:center;background:#111;display:flex;flex-direction:column;justify-content:center}
#info h2{font-size:2.5rem;margin-bottom:2rem;color:#c9a96e}
.prices{display:flex;justify-content:center;gap:2rem;flex-wrap:wrap;margin-bottom:3rem}
.price-card{background:#1a1a1a;padding:2.5rem;border-radius:20px;border:2px solid #c9a96e;min-width:250px;transition:.3s}
.price-card:hover{transform:translateY(-10px)}
.price-card .price{font-size:2.5rem;font-weight:800;color:#c9a96e}
footer{padding:2rem;text-align:center;background:#000;border-top:1px solid #c9a96e}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){.hero-content h1{font-size:2.5rem}}
</style>
</head>
<body>
<section id="hero">
<div class="hero-content">
<h1 class="gold">بن العطار</h1>
<p>قهوة تصنع للذوق</p>
<a href="tel:01030516417" class="btn">اطلب الآن 01030516417</a>
</div>
</section>
<section id="info">
<h2>أسعارنا</h2>
<div class="prices">
<div class="price-card"><h3>قهوة تركي</h3><div class="price">30 جنيه</div></div>
<div class="price-card"><h3>قهوة فرنساوي</h3><div class="price">45 جنيه</div></div>
</div>
<h2>العنوان</h2><p>أبو كبير - الشرقية - خلف المستشفى المركزي</p>
</section>
<footer><p>© 2026 بن العطار</p></footer>
</body>
</html>
