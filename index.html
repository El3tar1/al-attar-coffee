<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بن العطار - قهوة تصنع للذوق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Tajawal',sans-serif;background:#0a0a0a;color:#f5f2eb;text-align:center}
.gold{color:#c9a96e}
#hero{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=2070') center/cover;padding:1rem}
#hero h1{font-size:3.5rem;font-weight:800;margin-bottom:10px}
#hero p{font-size:1.3rem;margin-bottom:30px}
.btn{display:inline-block;padding:15px 35px;background:#c9a96e;color:#000;text-decoration:none;font-weight:800;font-size:1.1rem;border-radius:50px;margin:8px}
.btn-whatsapp{background:#25D366;color:#fff}
.btn-insta{background:#E4405F;color:#fff}
section{padding:4rem 1rem}
h2{font-size:2.2rem;margin-bottom:2rem;color:#c9a96e}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem;max-width:600px;margin:0 auto}
.card{background:#1a1a1a;padding:1.5rem;border-radius:15px;border:2px solid #c9a96e;transition:0.3s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(201,169,110,0.15)}
.price{font-size:1.8rem;font-weight:800;color:#c9a96e}
.contact-box{background:#111;padding:2rem;border-radius:15px;max-width:500px;margin:0 auto}
.contact-box .btn{display:block}
footer{padding:2rem;background:#000;border-top:1px solid #c9a96e}
@media(max-width:500px){.products{grid-template-columns:1fr}#hero h1{font-size:2.5rem}}

/* الدائرة */
.coffee-icon{
  width:120px;
  height:120px;
  border-radius:50%;
  border:3px solid #c9a96e;
  margin:0 auto 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:4rem;
  background:#0a0a0a;
  transition:0.4s;
  overflow:hidden;
}
.coffee-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}
.card:hover .coffee-icon{
  border-color:#f0d080;
  box-shadow:0 0 40px rgba(201,169,110,0.3);
  transform:scale(1.05);
}
</style>
</head>
<body>

<div id="hero">
<div>
<h1 class="gold">☕ بن العطار</h1>
<p>قهوة تصنع للذوق</p>
<a href="tel:01030516417" class="btn">اطلب الآن</a>
</div>
</div>

<section>
<h2>منتجاتنا</h2>
<div class="products">

  <!-- قهوة تركي سادة -->
  <div class="card">
    <div class="coffee-icon">
      <img src="https://images.unsplash.com/photo-1580933073521-d6f3fb2332b1?q=80&w=200&h=200&fit=crop" alt="قهوة تركي">
    </div>
    <h3>قهوة تركي سادة</h3>
    <div class="price">30 جنيه</div>
  </div>

  <!-- قهوة تركي محوج -->
  <div class="card">
    <div class="coffee-icon">
      <img src="https://images.unsplash.com/photo-1580933073521-d6f3fb2332b1?q=80&w=200&h=200&fit=crop" alt="قهوة تركي محوج">
    </div>
    <h3>قهوة تركي محوج</h3>
    <div class="price">35 جنيه</div>
  </div>

  <!-- قهوة فرنساوي سادة -->
  <div class="card">
    <div class="coffee-icon">
      <img src="https://images.unsplash.com/photo-1559056199-641a0ac8b55e?q=80&w=200&h=200&fit=crop" alt="قهوة فرنساوي">
    </div>
    <h3>قهوة فرنساوي سادة</h3>
    <div class="price">45 جنيه</div>
  </div>

  <!-- قهوة فرنساوي محوج -->
  <div class="card">
    <div class="coffee-icon">
      <img src="https://images.unsplash.com/photo-1559056199-641a0ac8b55e?q=80&w=200&h=200&fit=crop" alt="قهوة فرنساوي محوج">
    </div>
    <h3>قهوة فرنساوي محوج</h3>
    <div class="price">50 جنيه</div>
  </div>

</div>
</section>

<section>
<h2>تواصل معنا</h2>
<div class="contact-box">
<h3>📍 أبو كبير - الشرقية - خلف المستشفى المركزي</h3>
<p style="font-size:1.3rem;margin:15px 0">01030516417</p>
<a href="tel:01030516417" class="btn">📞 اتصال</a>
<a href="https://wa.me/201030516417" class="btn btn-whatsapp">💬 واتساب</a>
<a href="https://www.instagram.com/memoo_o_0" class="btn btn-insta">📸 انستجرام</a>
</div>
</section>

<footer>
<p>© 2026 بن العطار - قهوة تصنع للذوق</p>
</footer>

</body>
</html>
