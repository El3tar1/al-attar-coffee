<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بن العطار - قهوة تصنع للذوق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Tajawal',sans-serif;background:#0a0a0a;color:#f5f2eb;text-align:center}
.gold{color:#c9a96e}

/* ====== الهيرو بصورة قهوة جديدة وشغالة ====== */
#hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=2070') center/cover;
  padding:1rem;
}
#hero h1{font-size:3.5rem;font-weight:800;margin-bottom:10px}
#hero p{font-size:1.3rem;margin-bottom:30px}

.btn{display:inline-block;padding:15px 35px;background:#c9a96e;color:#000;text-decoration:none;font-weight:800;font-size:1.1rem;border-radius:50px;margin:8px}
.btn-whatsapp{background:#25D366;color:#fff}
.btn-insta{background:#E4405F;color:#fff}

section{padding:4rem 1rem}
h2{font-size:2.2rem;margin-bottom:2rem;color:#c9a96e}

/* ====== المنتجات ====== */
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem;max-width:600px;margin:0 auto}

.card{
  background:#1a1a1a;
  padding:1.5rem;
  border-radius:15px;
  border:2px solid #c9a96e;
}

/* صورة البن فوق كل منتج */
.card img{
  width:100%;
  max-width:120px;
  height:120px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid #c9a96e;
  margin-bottom:12px;
  display:block;
  margin-left:auto;
  margin-right:auto;
}

.price{font-size:1.8rem;font-weight:800;color:#c9a96e}

/* ====== باقي الكود ====== */
.contact-box{background:#111;padding:2rem;border-radius:15px;max-width:500px;margin:0 auto}
.contact-box .btn{display:block}
footer{padding:2rem;background:#000;border-top:1px solid #c9a96e}

@media(max-width:500px){
  .products{grid-template-columns:1fr}
  #hero h1{font-size:2.5rem}
}
</style>
</head>
<body>

<div id="hero">
<div>

</div>

    <h3>قهوة فرنساوي سادة</h3>
    <div class="price">45 جنيه</div>

    <h3>قهوة فرنساوي محوج</h3>
    <div class="price">50 جنيه</div>
  </div>

</div>
</section>

<section>
<h2>تواصل معنا</h2>

<h3>📍 أبو كبير - الشرقية - خلف المستشفى المركزي</h3>

<footer>
<p>© 2026 بن العطار - قهوة تصنع للذوق</p>

</body>
</html>
