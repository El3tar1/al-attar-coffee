<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>بن العطار - قهوة تصنع للذوق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;800&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#0a0a0a;color:#f5f2eb}
.gold{color:#c9a96e}
#hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;background:linear-gradient(rgba(10,10,10,0.7),rgba(10,10,10,0.9)),url('https://images.unsplash.com/photo-1447933601403-0c6688de566e?q=80&w=2070') center/cover}
#hero h1{font-size:4rem;font-weight:800;margin-bottom:1rem}
#hero p{font-size:1.5rem;margin-bottom:2rem}
.btn{display:inline-block;padding:18px 40px;background:#c9a96e;color:#0a0a0a;text-decoration:none;font-weight:800;font-size:1.2rem;border-radius:50px;margin:10px;transition:.3s;width:250px}
.btn:hover{transform:translateY(-5px)}
.btn-call{background:#c9a96e;color:#0a0a0a}
.btn-whatsapp{background:#25D366;color:#fff}
.btn-insta{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff}
section{padding:5rem 2rem;text-align:center}
h2{font-size:2.5rem;margin-bottom:2rem;color:#c9a96e}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2rem;max-width:800px;margin:0 auto}
.card{background:#1a1a1a;padding:2rem;border-radius:20px;border:2px solid #c9a96e;transition:.3s}
.card:hover{transform:translateY(-10px)}
.price{font-size:2rem;font-weight:800;color:#c9a96e}
.contact
